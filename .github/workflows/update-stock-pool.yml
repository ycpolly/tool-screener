name: Auto Update Stock Pool and Historical Market Data

on:
  schedule:
    # 台灣時間週一至週五 15:30 (UTC 07:30) 執行盤後初次數據更新
    - cron: '30 7 * * 1-5'
    # 台灣時間週一至週五 18:30 (UTC 10:30) 執行盤後籌碼與主力買超完整更新
    - cron: '30 10 * * 1-5'
    # 台灣時間週一至週五 23:00 (UTC 15:00) 執行夜間晚定確認與最終數據校對
    - cron: '0 15 * * 1-5'
  workflow_dispatch: {} # 支援在 GitHub 頁面手動點擊執行測試

permissions:
  contents: write

jobs:
  update-stock-pool:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Stock Pool and Market Data Update Script
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/update_stock_pool.py

      - name: Commit and Push Updated Stock Pool Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add js/data/stock-pool.js index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [Auto Bot] Update stock pool and historical market data ($(date +'%Y-%m-%d %H:%M:%S'))" && git push)
